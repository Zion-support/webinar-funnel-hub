<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Webinar Funnel Hub</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:120px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🎥 Webinar Funnel Hub</h1><p>Forecast your webinar funnel.</p><label>Registrations: <input id="r" type="number" value="300"></label> <label>Show-up rate (%): <input id="s" type="number" value="45"></label> <label>Close rate (%): <input id="c" type="number" value="5"></label> <label>Deal size ($): <input id="d" type="number" value="2000"></label> <button onclick="go()">Forecast</button><div id="out"></div><script>function go(){const g=id=>+document.getElementById(id).value;const att=Math.round(g('r')*g('s')/100),deals=(att*g('c')/100).toFixed(1),rev=Math.round(att*g('c')/100*g('d'));document.getElementById('out').textContent=`Expected attendees: ${att}\nProjected deals: ${deals}\nProjected revenue: $${rev.toLocaleString()}\n\nReminder cadence tip: T-7d, T-1d, T-1h boosts show-up ~18%.\nFull funnel automation: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/webinar-funnel-hub">GitHub</a> · <a href="https://ziontechgroup.com/newsletter-growth-copilot/">Newsletter Copilot</a></p></body></html>
