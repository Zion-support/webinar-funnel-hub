<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Webinar Funnel Hub</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:110px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🎥 Webinar Funnel Hub</h1><p>Forecast your webinar funnel.</p><label>Invites sent: <input id="i" type="number" value="2000"></label> <label>Registration rate (%): <input id="r" type="number" value="12"></label> <label>Show rate (%): <input id="s" type="number" value="45"></label> <button onclick="go()">Forecast</button><div id="out"></div><script>function go(){const i=+document.getElementById('i').value,r=+document.getElementById('r').value/100,s=+document.getElementById('s').value/100;const reg=Math.round(i*r),att=Math.round(reg*s),lead=Math.round(att*0.25);document.getElementById('out').textContent=`Registrations: ${reg}\nAttendees: ${att}\nQualified leads (25% of attendees): ${lead}\n\nAI tips: reminder cadence T-7/T-1/T-1h lifts show rate ~15pts; on-demand replay adds ~30% more views.\nFull funnel automation + CRM sync: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/webinar-funnel-hub">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-sales-call-analyst/">Sales Call Analyst</a></p></body></html>
